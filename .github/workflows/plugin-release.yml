name: Release Gameyfin plugin
on:
  workflow_call:
    inputs:
      actions_ref:
        description: Reviewed gameyfin/actions commit, identical to the caller's uses pin
        required: true
        type: string
      version_bump:
        description: Semantic version component to bump
        required: true
        type: string
    secrets:
      GAMEYFIN_KEYSTORE_BASE64:
        required: true
      GAMEYFIN_KEYSTORE_PASSWORD:
        required: true
      MARKETPLACE_BOT_PRIVATE_KEY:
        required: true
permissions:
  contents: read
concurrency:
  group: plugin-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository_owner == 'gameyfin' && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: plugin
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gameyfin/actions
          ref: ${{ inputs.actions_ref }}
          path: tooling
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - name: Prepare the version bump
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: python3 tooling/scripts/manual_release.py prepare "$VERSION_BUMP" plugin
      - name: Build and test
        working-directory: plugin
        run: ./gradlew clean build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unsigned-plugin
          path: plugin/build/libs/*.jar
          if-no-files-found: error
  release:
    needs: build
    environment: plugin-release
    runs-on: ubuntu-latest
    steps:
      - name: Create plugin release token
        id: plugin-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MARKETPLACE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MARKETPLACE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-administration: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: plugin
          token: ${{ steps.plugin-token.outputs.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gameyfin/actions
          ref: ${{ inputs.actions_ref }}
          path: tooling
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: unsigned-plugin
          path: unsigned
      - name: Commit, tag, sign, and publish
        env:
          GH_TOKEN: ${{ steps.plugin-token.outputs.token }}
          GAMEYFIN_KEYSTORE_BASE64: ${{ secrets.GAMEYFIN_KEYSTORE_BASE64 }}
          GAMEYFIN_KEYSTORE_PASSWORD: ${{ secrets.GAMEYFIN_KEYSTORE_PASSWORD }}
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: python3 tooling/scripts/manual_release.py publish "$VERSION_BUMP" plugin
      - name: Create marketplace token
        id: marketplace-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MARKETPLACE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MARKETPLACE_BOT_PRIVATE_KEY }}
          owner: gameyfin
          repositories: plugin-marketplace
          permission-contents: write
          permission-pull-requests: write
      - name: Propose marketplace manifest
        env:
          GH_TOKEN: ${{ steps.marketplace-token.outputs.token }}
        run: |
          cp plugin/marketplace.json .
          python3 tooling/scripts/propose_marketplace.py
